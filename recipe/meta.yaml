{% set name = "gridit" %}
{% set version = "0.9" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gridit-{{ version }}.tar.gz
  sha256: 847eb3bbc8ccd82d4dad907937c91ebc98ffc381d30100e1d07e67d67399c617

build:
  entry_points:
    - gridit = gridit.__main__:cli_main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - fiona
    - affine
    - numpy
    - geopandas
    - rasterio >=1.2.2
    - shapely

test:
  imports:
    - gridit
  commands:
    - pip check
    - gridit --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mwtoews/gridit
  summary: Spatial tools to translate raster or vector geometry data to regular grids
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mwtoews
